[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }]
ffi = false

[invariant]
runs = 40
depth = 20
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${RPC_URL_TESTNET}"
monad_mainnet = "${RPC_URL_MAINNET}"

[etherscan]
# Monad explorer verification config placeholder; filled in Phase 1 if a verified
# source path is found.
